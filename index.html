<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYBRID OS">
<meta name="theme-color" content="#0b1120">
<title>HYBRID // OS</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%230b1120' rx='100'/><text x='256' y='330' text-anchor='middle' font-size='300'>&#x1F3CB;&#xFE0F;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1120;--card:#1a2338;--bor:#263348;
  --txt:#e2e8f8;--mut:#5a7090;--dim:#2a3a55;
  --bl:#4f8ef7;--bldim:rgba(79,142,247,.14);
  --gr:#34d399;--grdim:rgba(52,211,153,.14);
  --am:#fbbf24;--amdim:rgba(251,191,36,.14);
  --co:#f87171;--codim:rgba(248,113,113,.14);
  --pu:#a78bfa;--pudim:rgba(167,139,250,.14);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;
  padding-bottom:calc(72px + var(--safe-b));overscroll-behavior:none;-webkit-text-size-adjust:100%}
::-webkit-scrollbar{display:none}
.bc{font-family:'Barlow Condensed',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.fadeUp{animation:fadeUp .28s ease both}
.cp{position:fixed;top:-10px;pointer-events:none;z-index:9999;animation:fall linear forwards;border-radius:2px}

/* NAV */
#topnav{position:sticky;top:0;z-index:200;background:rgba(11,17,32,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bor);
  padding:calc(var(--safe-t) + 11px) 18px 11px;
  display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:.1em;color:var(--bl)}
.logo em{color:var(--mut);font-style:normal;font-weight:400}
.streak-pill{display:flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--bor);border-radius:100px;padding:5px 12px 5px 8px}
.streak-num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;color:var(--am);line-height:1}
.streak-lbl{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}

/* DAY VIEWS */
.day-view{display:none;padding-bottom:12px}
.day-view.active{display:block;animation:fadeUp .28s ease}

/* HEADER */
.day-hdr{padding:18px 16px 0}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eyebrow::before{content:'';width:20px;height:1.5px;background:currentColor;border-radius:2px}
.day-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;
  line-height:.9;text-transform:uppercase;letter-spacing:-.01em}
.day-sub{font-size:13px;color:var(--mut);font-weight:300;margin-top:6px}

/* PROGRESS RING — fixed 100% design */
.prog-row{display:flex;align-items:center;gap:16px;padding:14px 16px 0}
.ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0}
.ring-wrap svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bor);stroke-width:5}
.ring-arc{fill:none;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset .5s ease,stroke .3s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0}
.ring-pct{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;line-height:1}
.ring-lbl{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.1em;
  color:var(--mut);text-transform:uppercase;margin-top:1px}
/* 100% complete state - ring turns green, shows checkmark */
.ring-wrap.complete .ring-arc{stroke:var(--gr)!important}
.ring-wrap.complete .ring-pct{display:none}
.ring-wrap.complete .ring-lbl{display:none}
.ring-check{display:none;font-size:22px;animation:pop .3s ease}
.ring-wrap.complete .ring-check{display:block}
.ring-wrap.complete{background:rgba(52,211,153,.08);border-radius:50%}

.pstats{display:flex;gap:20px}
.pstat-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;line-height:1}
.pstat-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:2px}

/* SWITCH BANNER */
.sw-banner{margin:14px 12px 0;background:var(--card);border:1px solid var(--bor);
  border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw-left{flex:1;min-width:0}
.sw-title{font-weight:600;font-size:14px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-sub{font-size:11px;color:var(--mut);font-weight:300;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-btn{flex-shrink:0;border-radius:100px;padding:8px 14px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;
  cursor:pointer;min-height:40px;white-space:nowrap;border:1.5px solid;transition:all .15s}
.sw-btn:active{transform:scale(.96)}

/* SECTION LABELS */
.sec-label{display:flex;align-items:center;gap:10px;margin:20px 16px 10px}
.sec-label-txt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.24em;text-transform:uppercase;flex-shrink:0}
.sec-line{flex:1;height:1px;background:var(--bor)}
.sec-norest{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;flex-shrink:0}
.ss-bar{width:2px;height:16px;background:rgba(248,113,113,.5);border-radius:2px;flex-shrink:0}

/* EXERCISE CARDS */
.ex-list{padding:0 12px}
.ex-card{background:var(--card);border:1px solid var(--bor);border-radius:12px;
  margin-bottom:8px;overflow:hidden;transition:border-color .2s,background .2s}
.ex-card.done-card{border-color:var(--bl);background:rgba(79,142,247,.07)}
.ex-card.done-card.run-card{border-color:var(--gr);background:rgba(52,211,153,.07)}
.ex-card.done-card.plyo-card{border-color:var(--am);background:rgba(251,191,36,.07)}
.ex-card.done-card.hiit-card{border-color:var(--co);background:rgba(248,113,113,.07)}
.ex-row{display:flex;align-items:stretch;min-height:58px;cursor:pointer;user-select:none}
.ex-chk{width:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--bor);cursor:pointer}
.chk-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:transparent;transition:all .18s}
.ex-card.done-card .chk-circle{background:var(--bl);border-color:var(--bl);color:#fff}
.ex-card.done-card.run-card .chk-circle{background:var(--gr);border-color:var(--gr);color:#0b1120}
.ex-card.done-card.plyo-card .chk-circle{background:var(--am);border-color:var(--am);color:#000}
.ex-card.done-card.hiit-card .chk-circle{background:var(--co);border-color:var(--co);color:#fff}
.ex-info{flex:1;padding:10px 10px 10px 14px;min-width:0}
.ex-name{font-weight:600;font-size:15px;line-height:1.25;color:var(--txt)}
.ex-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;align-items:center}
.ex-sets{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--bl)}
.run-card .ex-sets{color:var(--gr)}
.plyo-card .ex-sets{color:var(--am)}
.hiit-card .ex-sets{color:var(--co)}
.ex-rest{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mut);
  background:rgba(0,0,0,.3);padding:2px 7px;border-radius:4px}
.alt-badge{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.14em;
  color:var(--am);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);
  padding:1px 6px;border-radius:4px;display:none}
.ex-card.alt-on .alt-badge{display:inline-block}
.ex-chev{width:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--mut);font-size:13px;transition:transform .2s}
.ex-card.open .ex-chev{transform:rotate(180deg);color:var(--txt)}
.ex-body{display:none;padding:12px 14px 14px 54px;border-top:1px solid var(--bor);background:rgba(0,0,0,.18)}
.ex-card.open .ex-body{display:block}
.ex-note{font-size:13px;color:var(--mut);line-height:1.7;font-weight:300}
.ex-tempo{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.1em;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ex-tempo b{color:var(--txt);font-weight:600}
.alt-row{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.alt-hint{font-size:11px;color:var(--mut);font-weight:300;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt-swap-btn{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;border-radius:100px;padding:5px 12px;cursor:pointer;
  min-height:30px;transition:all .15s;border:1px solid rgba(79,142,247,.4);
  color:var(--bl);background:var(--bldim)}
.ex-card.alt-on .alt-swap-btn{color:var(--am);background:var(--amdim);border-color:rgba(251,191,36,.4)}

/* RUN METRICS */
.run-metrics{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.rmc{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:14px}
.rmc-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--gr);margin-bottom:5px}
.rmc-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;line-height:1;color:var(--txt);margin-bottom:3px}
.rmc-desc{font-size:11px;color:var(--mut);line-height:1.5;font-weight:300}
.shoe-chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--bor);border-radius:100px;padding:8px 14px 8px 10px;
  margin:10px 12px 0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--gr);text-transform:uppercase}

/* MOBILITY */
.mob-grid{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mob-item{background:var(--card);border:1px solid var(--bor);border-radius:10px;
  padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:all .18s;min-height:54px}
.mob-item:active{transform:scale(.97)}
.mob-item.mob-done{border-color:var(--pu);background:var(--pudim)}
.mob-chk{width:18px;height:18px;border-radius:5px;flex-shrink:0;margin-top:1px;
  border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:transparent;transition:all .18s}
.mob-item.mob-done .mob-chk{background:var(--pu);border-color:var(--pu);color:#fff}
.mob-name{font-size:13px;font-weight:500;line-height:1.3}
.mob-reps{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mut);margin-top:2px}

/* OPT */
.opt-grid{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-card{background:var(--card);border:1px dashed rgba(167,139,250,.4);border-radius:12px;padding:16px}
.opt-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--pu);margin-bottom:6px}
.opt-card p{font-size:12px;color:var(--mut);line-height:1.6;font-weight:300}

/* COMPLETE / INCOMPLETE BUTTONS */
.btn-row{padding:16px 12px 4px;display:flex;gap:8px}
.comp-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 12px;border:none;border-radius:12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:19px;
  letter-spacing:.1em;text-transform:uppercase;transition:all .2s}
.comp-btn:active{transform:scale(.98)}
.comp-btn.lift-btn{background:var(--bl);color:#fff;box-shadow:0 6px 20px rgba(79,142,247,.35)}
.comp-btn.run-btn{background:var(--gr);color:#0b1120;box-shadow:0 6px 20px rgba(52,211,153,.35)}
.comp-btn.plyo-btn{background:var(--am);color:#0b1120;box-shadow:0 6px 20px rgba(251,191,36,.3)}
.comp-btn.rest-btn{background:var(--pu);color:#fff}
.comp-btn.done-state{background:rgba(52,211,153,.12)!important;color:var(--gr)!important;
  border:1.5px solid var(--gr)!important;box-shadow:none!important}
.comp-btn.done-state:active{transform:none}
.incomp-btn{flex-shrink:0;display:none;align-items:center;justify-content:center;
  padding:16px 14px;border:1.5px solid rgba(248,113,113,.4);border-radius:12px;cursor:pointer;
  background:rgba(248,113,113,.08);color:var(--co);
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;transition:all .2s;white-space:nowrap}
.incomp-btn.visible{display:flex}
.incomp-btn:active{transform:scale(.96)}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--gr);
  border-radius:100px;padding:10px 22px;z-index:400;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.06em;color:var(--gr);white-space:nowrap;
  box-shadow:0 4px 20px rgba(52,211,153,.3);
  opacity:0;pointer-events:none;transition:opacity .3s,bottom .3s}
#toast.show{opacity:1;bottom:88px}

/* TAB BAR */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:rgba(17,24,39,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--bor);padding-bottom:var(--safe-b);
  display:flex;height:calc(68px + var(--safe-b))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;padding:6px 2px;position:relative;user-select:none}
.tab:active{opacity:.6}
.tab-icon{font-size:19px;line-height:1;transition:transform .15s}
.tab.act .tab-icon{transform:scale(1.15)}
.tab-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);transition:color .15s}
.tab.act .tab-lbl{color:var(--txt)}
.tab-bar-top{position:absolute;top:0;left:20%;right:20%;height:2px;border-radius:2px;background:transparent}
.tab-done-dot{position:absolute;top:5px;right:calc(50% - 14px);
  width:6px;height:6px;border-radius:50%;background:var(--gr);display:none}
.tab.day-done .tab-done-dot{display:block}
</style>
</head>
<body>

<div id="topnav">
  <div class="logo bc">HYBRID<em> // OS</em></div>
  <div class="streak-pill">
    <span style="font-size:17px">&#x1F525;</span>
    <div>
      <div class="streak-num" id="snum">0</div>
      <div class="streak-lbl">STREAK</div>
    </div>
  </div>
</div>

<div id="views"></div>
<div id="tabbar"></div>
<div id="toast"></div>

<script>
/* ============================================================
   EXERCISE POOLS — 5+ options per slot, picked randomly
   Each slot: { group, options: [{n,s,r,note,t?,an?,as_?,ar?,anote?,at?,hiit?}] }
============================================================ */

// helper: pick N random items from array without repeats
function pick(arr,n){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,n);
}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}

/* ---- MONDAY POOLS (Push) ---- */
const MON_MAIN=[
  {n:"Barbell Bench Press",s:"4x5-6",r:"2-3 min",note:"3s eccentric. Touch chest, drive up. Primary strength builder.",t:"3-1-X-0"},
  {n:"Dumbbell Flat Press",s:"4x8-10",r:"2 min",note:"Greater ROM than barbell. Full pec stretch at bottom.",t:"2-1-1-0"},
  {n:"Incline Barbell Press",s:"4x6-8",r:"2 min",note:"30 deg incline. Upper chest focus. Control the descent.",t:"3-1-X-0"},
  {n:"Close-Grip Bench Press",s:"4x6-8",r:"2 min",note:"Narrow grip hits triceps hard while still loading chest. Elbows at 45 deg.",t:"2-1-X-0"},
  {n:"Push Press (BB)",s:"4x5",r:"2 min",note:"Leg drive to initiate, press lockout. Builds explosive pushing power.",t:"explosive"},
  {n:"Landmine Press",s:"4x10 ea.",r:"90 sec",note:"Single-arm. Hits upper-inner chest. More rotational stability demand.",t:"2-0-1-1"},
];
const MON_INCLINE=[
  {n:"Incline DB Press",s:"3x10-12",r:"90 sec",note:"30-45 deg. Drive pinkies up at top for upper chest peak.",t:"2-0-1-1"},
  {n:"Cable Chest Fly (Cross-body)",s:"3x14-16",r:"90 sec",note:"Cables high. Pull down and across. Constant tension on pec.",t:"2-0-1-2"},
  {n:"Incline Cable Press",s:"3x12",r:"90 sec",note:"Cable bench at incline. Constant tension through full ROM.",t:"2-0-1-1"},
  {n:"DB Squeeze Press",s:"3x12",r:"90 sec",note:"Flat bench. Press DBs together and hold squeeze throughout. Inner chest.",t:"2-1-1-1"},
  {n:"Machine Chest Press",s:"3x12-15",r:"75 sec",note:"Focus on feel not load. Full stretch at bottom, squeeze at top.",t:"2-0-1-2"},
];
const MON_SHOULDER_A=[
  {n:"Cable Lateral Raise",s:"3x15 ea.",r:"--",note:"Lead with elbow. Cable = constant tension at bottom.",t:"2-0-1-2"},
  {n:"Leaning DB Lateral Raise",s:"3x15 ea.",r:"--",note:"Hold support, lean away. Lengthened position = more medial delt.",t:"2-0-1-2"},
  {n:"Plate Front Raise",s:"3x15",r:"--",note:"Plate at arms length. Control the descent. Front delt and upper chest.",t:"2-0-1-1"},
  {n:"Arnold Press",s:"3x10-12",r:"--",note:"Palms face you at start, rotate out as you press. Hits all 3 delt heads.",t:"2-1-1-0"},
  {n:"Upright Row (EZ Bar)",s:"3x12",r:"--",note:"Elbows flare wide. Pull to chin. Medial delt and trap involvement.",t:"2-1-1-0"},
];
const MON_SHOULDER_B=[
  {n:"Overhead Press (DB)",s:"3x10-12",r:"75 sec",note:"Full lockout, lower with control. Full delt activation.",t:"2-1-1-0"},
  {n:"Seated DB OHP",s:"3x10-12",r:"75 sec",note:"Back supported. Strict form. Drive elbows forward slightly at top.",t:"2-1-1-0"},
  {n:"Rear Delt Cable Fly",s:"3x16",r:"75 sec",note:"Cables crossed at chest. Pull wide and squeeze. 3D rear delt.",t:"2-0-1-2"},
  {n:"Facepull superset w/ OHP",s:"3x12",r:"75 sec",note:"Facepull first to warm external rotators, then OHP. Shoulder health.",t:"2-1-1-0"},
  {n:"Dumbbell YTW",s:"3x10 ea.",r:"60 sec",note:"Prone on incline. Y-T-W positions. Rear delt and rotator cuff.",t:"2-0-1-2"},
];
const MON_TRI_A=[
  {n:"Close-Grip Bench / Skull Crushers",s:"3x10-12",r:"--",note:"Alternate weekly. Skull crushers: bar past forehead, elbows at ceiling.",t:"2-1-1-0"},
  {n:"Weighted Dips",s:"3x8-10",r:"--",note:"Upright torso = tricep focus. Add belt weight when BW is easy.",t:"2-1-X-0"},
  {n:"Tricep Pushdown (rope)",s:"3x15",r:"--",note:"Pull rope apart at bottom. Full extension every rep.",t:"2-0-1-1"},
  {n:"JM Press",s:"3x10",r:"--",note:"Hybrid between skull crusher and close-grip. Bar comes to throat.",t:"2-1-1-0"},
  {n:"Diamond Push-Ups",s:"3x max",r:"--",note:"Weighted if easy. Elbows tuck in tight. Full ROM.",t:"2-1-X-0"},
];
const MON_TRI_B=[
  {n:"Cable Overhead Tricep Ext.",s:"3x12-15",r:"60 sec",note:"Long head stretch. Elbows tight, pointing at ceiling.",t:"2-0-1-1"},

   STATE
============================================================ */
const SK='hybridOS_v5';
let S={checked:{},doneDays:[],streak:0,lastDate:'',lastActive:DAYS[(new Date().getDay()+6)%7],mobDone:{},workout:{}};
// workout[day] = current generated workout sections/variant
function loadS(){
  try{const r=JSON.parse(localStorage.getItem(SK)||'{}');Object.assign(S,r);}catch(e){}
  ['checked','doneDays','streak','lastDate','switched','mobDone','workout'].forEach(k=>{
    if(S[k]===undefined)S[k]=k==='doneDays'?[]:k==='streak'?0:k==='lastDate'?'':{}; 
  });
  if(!S.lastActive)S.lastActive=DAYS[(new Date().getDay()+6)%7];
}
function saveS(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}

let activeDay=null;
let expandedCards=new Set();

/* ============================================================
   WORKOUT GENERATION
============================================================ */
function genMonWorkout(){
  return{
    label:"Push Day",
    secs:[
      {label:"Main Lift",ac:"bl",ex:[rand(MON_MAIN)]},
      {label:"Upper Chest",ac:"bl",ex:[rand(MON_INCLINE)]},
      {label:"Shoulders",ac:"bl",ss:true,ex:[rand(MON_SHOULDER_A),rand(MON_SHOULDER_B)]},
      {label:"Triceps",ac:"bl",ss:true,ex:[rand(MON_TRI_A),rand(MON_TRI_B)]},
      {label:"Core and Conditioning",ac:"co",ex:[...pick(MON_CORE,2),rand(MON_COND)]},
    ]
  };
}
function genTueWorkout(){
  return{
    label:"Pull Day",
    secs:[
      {label:"Main Hinge",ac:"bl",ex:[rand(TUE_HINGE)]},
      {label:"Vertical Pull",ac:"bl",ex:[rand(TUE_PULLUP)]},
      {label:"Horizontal Pull",ac:"bl",ex:[rand(TUE_ROW)]},
      {label:"Arms",ac:"bl",ss:true,ex:[rand(TUE_CURL),rand(TUE_REAR)]},
      {label:"Core and Conditioning",ac:"co",ex:[...pick(TUE_CORE,2),rand(TUE_COND)]},
    ]
  };
}
function genThuWorkout(){
  return{
    label:"Plyo Day",
    secs:[
      {label:"Vertical Power",ac:"am",ex:[rand(THU_VERT)]},
      {label:"Reactive Power",ac:"am",ex:[rand(THU_REACTIVE)]},
      {label:"Single-Leg Stability",ac:"am",ex:[rand(THU_SLSTAB),rand(THU_GLUEMED),rand(THU_SPLIT)]},
      {label:"Copenhagen Block",ac:"am",ss:true,ex:THU_COP},
      {label:"Glute and Hip",ac:"am",ex:[rand(THU_GLUEHIP)]},
      {label:"Core — Lateral",ac:"co",ss:true,ex:[rand(THU_LATERALCORE),rand(THU_ANTIROT)]},
      {label:"Conditioning Finisher",ac:"co",ex:[rand(THU_COND)]},
    ]
  };
}
function genRunWorkout(day){
  const pool=day==='wed'?WED_VARIANTS:day==='fri'?FRI_VARIANTS:SUN_VARIANTS;
  return rand(pool);
}

function getWorkout(day){
  if(!S.workout[day]){
    S.workout[day]=day==='mon'?genMonWorkout():day==='tue'?genTuWorkout():day==='thu'?genThuWorkout():null;
    if(['wed','fri','sun'].includes(day)) S.workout[day]=genRunWorkout(day);
    saveS();
  }
  return S.workout[day];
}
// typo fix
function genTuWorkout(){return genTueWorkout();}

/* ============================================================
   CARD KEYS for tracking progress
============================================================ */
function cardKeys(day){
  const w=getWorkout(day);
  if(!w) return [];
  if(w.cl) return w.cl.map((_,i)=>`${day}-cl-${i}`);
  const keys=[];
  (w.secs||[]).forEach((sec,si)=>(sec.ex||[]).forEach((_,ei)=>keys.push(`${day}-${si}-${ei}`)));
  return keys;
}
function donePct(day){
  const k=cardKeys(day),t=k.length;
  return t?Math.round(k.filter(k=>S.checked[k]).length/t*100):0;
}
function updateRing(day){
  const p=donePct(day),r=28,circ=2*Math.PI*r;
  const arc=document.getElementById('arc-'+day);
  const pctEl=document.getElementById('pct-'+day);
  const wrap=document.getElementById('ring-'+day);
  if(arc) arc.style.strokeDashoffset=circ-(p/100)*circ;
  if(pctEl) pctEl.textContent=p+'%';
  if(wrap){
    wrap.classList.toggle('complete',p===100);
  }
}

/* ============================================================
   TOAST
============================================================ */
let TT=null;
function showToast(msg,col){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=col||'var(--gr)';
  t.style.color=col||'var(--gr)';
  t.style.boxShadow='0 4px 20px '+(col||'rgba(52,211,153,.3)');
  t.classList.add('show');
  if(TT)clearTimeout(TT);
  TT=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ============================================================
   CONFETTI
============================================================ */
function confetti(){
  const cols=['#4f8ef7','#34d399','#fbbf24','#a78bfa','#f87171','#fff'];
  for(let i=0;i<60;i++){
    setTimeout(()=>{
      const el=document.createElement('div');el.className='cp';
      const sz=Math.random()*8+4;
      el.style.cssText='left:'+Math.random()*100+'vw;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+(Math.random()*2+1.5)+'s;animation-delay:'+(Math.random()*.4)+'s;';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),4500);
    },i*18);
  }
}

/* ============================================================
   STREAK
============================================================ */
function bumpStreak(){
  const today=new Date().toISOString().split('T')[0];
  if(S.lastDate===today)return;
  const yest=new Date(Date.now()-86400000).toISOString().split('T')[0];
  S.streak=(S.lastDate===yest||!S.lastDate)?S.streak+1:1;
  S.lastDate=today;
  document.getElementById('snum').textContent=S.streak;
}

/* ============================================================
   ESC
============================================================ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ============================================================
   CHECK CARD
============================================================ */
function checkCard(key,el){
  const card=el.closest('.ex-card');
  S.checked[key]=!S.checked[key];
  const done=S.checked[key];
  card.classList.toggle('done-card',done);
  card.querySelector('.chk-circle').style.color=done?'':'transparent';
  saveS();
  const day=key.split('-')[0];
  updateRing(day);
}

/* ============================================================
   TOGGLE EXPAND
============================================================ */
function toggleExpand(id){
  const c=document.getElementById(id);
  if(!c||!c.querySelector('.ex-body'))return;
  c.classList.toggle('open');
  if(c.classList.contains('open'))expandedCards.add(id);else expandedCards.delete(id);
}

/* ============================================================
   TOGGLE ALT (per-exercise swap)
============================================================ */
function toggleAlt(id,btn){
  const c=document.getElementById(id);if(!c)return;
  const isAlt=c.classList.toggle('alt-on');
  const get=(a,b)=>isAlt?(b||a):a;
  const nm=c.querySelector('.ex-name'),st=c.querySelector('.ex-sets');
  const rs=c.querySelector('.ex-rest'),nt=c.querySelector('.ex-note');
  const tp=c.querySelector('.ex-tempo-val'),ht=c.querySelector('.alt-hint');
  if(nm)nm.textContent=get(c.dataset.mn,c.dataset.an);
  if(st)st.textContent=get(c.dataset.ms,c.dataset.as);
  if(rs&&c.dataset.ar)rs.textContent=get(c.dataset.mr,c.dataset.ar);
  if(nt)nt.textContent=get(c.dataset.mnote,c.dataset.anote||c.dataset.mnote);
  if(tp)tp.textContent=get(c.dataset.mt,c.dataset.at||c.dataset.mt||'');
  if(ht)ht.textContent=isAlt?('Back: '+c.dataset.mn):('Alt: '+c.dataset.an);
  btn.textContent=isAlt?'revert':'swap';
}

/* ============================================================
   SWITCH WORKOUT (regenerate)
============================================================ */
function switchWorkout(day){
  // Clear checked for this day
  Object.keys(S.checked).forEach(k=>{if(k.startsWith(day+'-'))delete S.checked[k];});
  // Regenerate
  if(day==='mon')S.workout[day]=genMonWorkout();
  else if(day==='tue')S.workout[day]=genTuWorkout();
  else if(day==='thu')S.workout[day]=genThuWorkout();
  else if(['wed','fri','sun'].includes(day))S.workout[day]=genRunWorkout(day);
  expandedCards.clear();
  saveS();
  renderDay(day);
  updateRing(day);
  showToast('&#x1F4A5; New combo generated!','var(--am)');
}

/* ============================================================
   COMPLETE / INCOMPLETE DAY
============================================================ */
function completeDay(day){
  if(S.doneDays.includes(day))return;
  cardKeys(day).forEach(k=>{S.checked[k]=true;});
  S.doneDays.push(day);
  bumpStreak();saveS();
  renderDay(day);
  document.querySelector('.tab[data-day="'+day+'"]')?.classList.add('day-done');
  updateRing(day);
  confetti();
  const msgs={mon:'&#x1F525; Push day crushed. Chest is growing.',tue:'&#x1F4AA; Pull day done. Deadlift numbers up.',wed:'&#x26A1; Intervals smashed. VO2 max climbing.',thu:'&#x1F998; Plyo done. Bulletproof hips incoming.',fri:'&#x1F30A; Legs flushed. Sunday will feel great.',sat:'&#x1F9D8; Recovery locked. Consistency wins.',sun:'&#x1F3C3; Long run banked. Engine building.'};
  showToast(msgs[day]);
}

function incompleteDay(day){
  S.doneDays=S.doneDays.filter(d=>d!==day);
  // uncheck all cards
  Object.keys(S.checked).forEach(k=>{if(k.startsWith(day+'-'))S.checked[k]=false;});
  saveS();
  renderDay(day);
  document.querySelector('.tab[data-day="'+day+'"]')?.classList.remove('day-done');
  updateRing(day);
  showToast('&#x21A9; Marked as incomplete','var(--co)');
}

/* ============================================================
   BUILD EXERCISE CARD HTML
============================================================ */
function buildCard(day,ex,tc,key,id){
  const done=!!S.checked[key];
  const clr=tc==='run-card'?'var(--gr)':tc==='plyo-card'?'var(--am)':tc==='hiit-card'?'var(--co)':'var(--bl)';
  const chkFg=done?(tc==='plyo-card'?'#000':''):'transparent';
  const hasAlt=!!(ex.an);
  return '<div class="ex-card '+tc+(ex.hiit?' hiit-card':'')+(done?' done-card':'')+(hasAlt?'':'')+'" id="'+id+'"'+
    ' data-mn="'+esc(ex.n)+'" data-an="'+esc(ex.an||'')+'"'+
    ' data-ms="'+esc(ex.s)+'" data-as="'+esc(ex.as_||'')+'"'+
    ' data-mr="'+esc(ex.r||'')+'" data-ar="'+esc(ex.ar||'')+'"'+
    ' data-mnote="'+esc(ex.note||'')+'" data-anote="'+esc(ex.anote||'')+'"'+
    ' data-mt="'+esc(ex.t||'')+'" data-at="'+esc(ex.at||'')+'">'+
    '<div class="ex-row" onclick="toggleExpand(\''+id+'\')">'+
    '<div class="ex-chk" onclick="event.stopPropagation();checkCard(\''+key+'\',this)">'+
    '<div class="chk-circle" style="border-color:'+( done?clr:'var(--dim)')+';background:'+(done?clr:'transparent')+';color:'+chkFg+'">&#x2713;</div></div>'+
    '<div class="ex-info"><div class="ex-name">'+ex.n+'</div>'+
    '<div class="ex-meta"><span class="ex-sets" style="color:'+(ex.hiit?'var(--co)':clr)+'">'+esc(ex.s)+'</span>'+
    (ex.r&&ex.r!=='--'?'<span class="ex-rest">'+esc(ex.r)+'</span>':'')+
    (hasAlt?'<span class="alt-badge">ALT</span>':'')+
    '</div></div>'+
    (ex.note?'<div class="ex-chev">&#x25BE;</div>':'')+
    '</div>'+
    (ex.note?
      '<div class="ex-body">'+
      '<div class="ex-note">'+esc(ex.note)+'</div>'+
      (ex.t?'<div class="ex-tempo">TEMPO <b class="ex-tempo-val">'+esc(ex.t)+'</b></div>':'')+
      (hasAlt?
        '<div class="alt-row"><span class="alt-hint">Alt: '+esc(ex.an)+'</span>'+
        '<button class="alt-swap-btn" onclick="event.stopPropagation();toggleAlt(\''+id+'\',this)">swap</button></div>':'')+
      '</div>':'')+
    '</div>';
}

/* ============================================================
   RENDER DAY
============================================================ */
function renderDay(day){
  const d=DAYMETA[day];
  const w=getWorkout(day);
  const ac=TYPEAC[d.type]||'var(--bl)';
  const isDone=S.doneDays.includes(day);
  const btnClass={lift:'lift-btn',run:'run-btn',plyo:'plyo-btn',rest:'rest-btn'}[d.type]||'lift-btn';
  const tc={lift:'',run:'run-card',plyo:'plyo-card',rest:''}[d.type]||'';
  const p=donePct(day),r=28,circ=2*Math.PI*r,offset=circ-(p/100)*circ;
  let h='';

  // Header
  h+='<div class="day-hdr"><div class="eyebrow" style="color:'+ac+'">'+esc(d.label)+' &middot; '+(d.type==='lift'?(day==='mon'?'Push Day':'Pull Day'):d.type==='plyo'?'Plyo Day':d.type==='run'?'Run Day':'Rest')+'</div>'+
    '<div class="day-title bc">'+d.title.map(t=>esc(t)).join('<br>')+'</div>'+
    '<div class="day-sub">'+esc(d.sub)+'</div></div>';

  // Progress ring (not rest)
  if(d.type!=='rest'){
    h+='<div class="prog-row">'+
      '<div class="ring-wrap'+(p===100?' complete':'')+'" id="ring-'+day+'">'+
      '<svg width="64" height="64" viewBox="0 0 64 64" style="position:absolute;top:0;left:0;transform:rotate(-90deg)">'+
      '<circle class="ring-bg" cx="32" cy="32" r="'+r+'"/>'+
      '<circle class="ring-arc" id="arc-'+day+'" cx="32" cy="32" r="'+r+'" style="stroke:'+ac+';stroke-dasharray:'+circ+';stroke-dashoffset:'+offset+'"/>'+
      '</svg>'+
      '<div class="ring-center">'+
      '<div class="ring-check">&#x2705;</div>'+
      '<div class="ring-pct" style="color:'+ac+'">'+p+'%</div>'+
      '<div class="ring-lbl">done</div>'+
      '</div></div>'+
      '<div class="pstats">'+
      '<div><div class="pstat-val bc" style="color:'+ac+'">'+d.stats.ex+'</div><div class="pstat-lbl mono">'+(d.type==='run'?'checks':'exercises')+'</div></div>'+
      '<div><div class="pstat-val bc" style="color:var(--am)">~'+d.stats.min+'</div><div class="pstat-lbl mono">minutes</div></div>'+
      '</div></div>';
  }

  // Switch banner
  if(d.type!=='rest'){
    const wlabel=w?(w.label||'Current Workout'):'Workout';
    const wsub=w?(w.short||w.sub||'Tap switch to mix it up'):'Tap switch for a new combo';
    h+='<div class="sw-banner"><div class="sw-left"><div class="sw-title">'+esc(wlabel)+'</div><div class="sw-sub">'+esc(wsub)+'</div></div>'+
      '<button class="sw-btn" style="color:'+ac+';border-color:'+ac+';background:rgba(79,142,247,.1)" onclick="switchWorkout(\''+day+'\')">&#x21C4; SWITCH</button></div>';
  }

  // Sections (lift/plyo)
  if(w&&w.secs){
    w.secs.forEach((sec,si)=>{
      const sac=AC[sec.ac]||'var(--mut)';
      h+='<div class="sec-label">'+
        (sec.ss?'<div class="ss-bar"></div>':'')+
        '<span class="sec-label-txt" style="color:'+sac+'">'+esc(sec.label)+'</span>'+
        '<div class="sec-line"></div>'+
        (sec.ss?'<span class="sec-norest">NO REST</span>':'')+
        '</div><div class="ex-list">';
      (sec.ex||[]).forEach((ex,ei)=>{
        const key=day+'-'+si+'-'+ei;
        const id='c-'+day+'-'+si+'-'+ei;
        h+=buildCard(day,ex,ex.hiit?'hiit-card':tc,key,id);
      });
      h+='</div>';
    });
  }

  // Run day
  if(w&&w.metrics){
    h+='<div class="sec-label"><span class="sec-label-txt" style="color:var(--gr)">Session Details</span><div class="sec-line"></div></div>'+
      '<div class="run-metrics">';
    w.metrics.forEach(m=>{
      h+='<div class="rmc"><div class="rmc-lbl mono">'+esc(m.lbl)+'</div><div class="rmc-val bc">'+esc(m.val)+'</div><div class="rmc-desc">'+esc(m.desc)+'</div></div>';
    });
    h+='</div><div class="sec-label"><span class="sec-label-txt" style="color:var(--gr)">Checklist</span><div class="sec-line"></div></div><div class="ex-list">';
    (w.cl||[]).forEach((item,i)=>{
      const key=day+'-cl-'+i;
      const done=!!S.checked[key];
      const clr='var(--gr)';
      h+='<div class="ex-card run-card'+(done?' done-card':'')+'"><div class="ex-row" onclick="checkCard(\''+key+'\',this)">'+
        '<div class="ex-chk"><div class="chk-circle" style="border-color:'+(done?clr:'var(--dim)')+';background:'+(done?clr:'transparent')+';color:'+(done?'#0b1120':'transparent')+'">&#x2713;</div></div>'+
        '<div class="ex-info"><div class="ex-name">'+esc(item)+'</div></div></div></div>';
    });
    h+='</div>';
    if(w.shoe) h+='<div class="shoe-chip mono">&#x1F45F; '+esc(w.shoe)+'</div>';
  }

  // Rest day
  if(d.type==='rest'){
    h+='<div class="sec-label"><span class="sec-label-txt" style="color:var(--pu)">Mobility Protocol — 15-20 min</span><div class="sec-line"></div></div><div class="mob-grid">';
    SAT_MOB.forEach((m,i)=>{
      const dk='mob-sat-'+i,done=!!S.mobDone[dk];
      h+='<div class="mob-item'+(done?' mob-done':'')+'" onclick="toggleMob(\''+dk+'\',this)">'+
        '<div class="mob-chk" style="border-color:'+(done?'var(--pu)':'var(--dim)')+';background:'+(done?'var(--pu)':'transparent')+';color:'+(done?'#fff':'transparent')+'">&#x2713;</div>'+
        '<div><div class="mob-name">'+esc(m.n)+'</div><div class="mob-reps mono">'+esc(m.r)+'</div></div></div>';
    });
    h+='</div><div class="sec-label" style="margin-top:24px"><span class="sec-label-txt" style="color:var(--pu)">Optional Activities</span><div class="sec-line"></div></div><div class="opt-grid">';
    SAT_OPT.forEach(o=>{
      h+='<div class="opt-card"><div class="opt-title bc">'+o.t+'</div><p>'+esc(o.d)+'</p></div>';
    });
    h+='</div>';
  }

  // Buttons row
  h+='<div class="btn-row">'+
    '<button class="comp-btn '+(isDone?'done-state':btnClass)+'" id="cbtn-'+day+'" onclick="completeDay(\''+day+'\')">'+
    (isDone?'&#x2713; Complete!':'&#x26A1; Complete '+esc(d.label))+'</button>'+
    '<button class="incomp-btn'+(isDone?' visible':'')+'" id="ibtn-'+day+'" onclick="incompleteDay(\''+day+'\')">&#x21A9; Undo</button>'+
    '</div><div style="height:8px"></div>';

  let el=document.getElementById('view-'+day);
  if(!el){el=document.createElement('div');el.id='view-'+day;el.className='day-view';document.getElementById('views').appendChild(el);}
  el.innerHTML=h;
  expandedCards.forEach(id=>{document.getElementById(id)?.classList.add('open');});
}

/* ============================================================
   MOBILITY TOGGLE
============================================================ */
function toggleMob(key,el){
  S.mobDone[key]=!S.mobDone[key];
  el.classList.toggle('mob-done',S.mobDone[key]);
  const chk=el.querySelector('.mob-chk');
  const done=S.mobDone[key];
  chk.style.background=done?'var(--pu)':'transparent';
  chk.style.borderColor=done?'var(--pu)':'var(--dim)';
  chk.style.color=done?'#fff':'transparent';
  saveS();
}

/* ============================================================
   TAB BAR
============================================================ */
function buildTabs(){
  const tb=document.getElementById('tabbar');
  DAYS.forEach(day=>{
    const d=DAYMETA[day];
    const el=document.createElement('div');
    el.className='tab'+(S.doneDays.includes(day)?' day-done':'');
    el.dataset.day=day;
    const ac=TYPEAC[d.type]||'var(--bl)';
    el.innerHTML='<div class="tab-bar-top" id="tbt-'+day+'"></div><div class="tab-done-dot"></div><div class="tab-icon">'+d.icon+'</div><div class="tab-lbl mono">'+d.tab+'</div>';
    el.onclick=()=>goDay(day);
    tb.appendChild(el);
  });
}

/* ============================================================
   SWITCH DAY
============================================================ */
function goDay(day){
  if(activeDay)document.getElementById('view-'+activeDay)?.classList.remove('active');
  document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('act');document.getElementById('tbt-'+t.dataset.day).style.background='transparent';});
  activeDay=day;S.lastActive=day;saveS();
  const v=document.getElementById('view-'+day);
  if(v){v.classList.add('active');}
  window.scrollTo({top:0,behavior:'instant'});
  const tab=document.querySelector('.tab[data-day="'+day+'"]');
  if(tab){tab.classList.add('act');document.getElementById('tbt-'+day).style.background=TYPEAC[DAYMETA[day].type]||'var(--bl)';}
}

/* ============================================================
   INIT
============================================================ */
function init(){
  loadS();
  document.getElementById('snum').textContent=S.streak;
  DAYS.forEach(d=>renderDay(d));
  buildTabs();
  S.doneDays.forEach(d=>document.querySelector('.tab[data-day="'+d+'"]')?.classList.add('day-done'));
  DAYS.forEach(d=>updateRing(d));
  goDay(S.lastActive||DAYS[(new Date().getDay()+6)%7]);
}
init();
</script>

<script>
/* ═══════════════════════════════════════════
   PATCH v2 — Applied over base script
   1. Fix ring (always render empty, updateRing after)
   2. Undo complete day
   3. Random alternates pool per exercise
═══════════════════════════════════════════ */

/* ── ALTERNATES POOL ──
   Keyed by exercise name. Each entry is an array of alternates.
   toggleAlt() picks randomly, skipping the last used one.
*/
const ALT_POOL = {
  // MONDAY PUSH
  "Barbell Bench Press": [
    {n:"Dumbbell Flat Press",s:"4 × 8–10 reps",r:"2 min",note:"Greater ROM. Elbows ~75°. Same chest, more shoulder-friendly.",t:"2-1-1-0"},

    {n:"Push-Up Variations (Weighted)",s:"4 × 15–20 reps",r:"90 sec",note:"Plate on back or feet elevated. Full pec stretch at bottom.",t:"2-1-X-0"},
    {n:"Cable Chest Press",s:"4 × 10–12 reps",r:"90 sec",note:"Cables set at chest height. Constant load through full ROM.",t:"2-0-1-1"},
    {n:"Floor Press (BB or DB)",s:"4 × 6–8 reps",r:"2 min",note:"Eliminates leg drive. Pure tricep + pec. Great for lockout strength.",t:"2-1-X-0"},

// Override toggleAlt to use the pool with random selection
// Track last used alt per cardId to avoid same one twice in a row
const _lastAlt = {};

function toggleAlt(cardId, btn) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const isNowAlt = !card.classList.contains('alt-on');
  card.classList.toggle('alt-on', isNowAlt);

  const nm = card.querySelector('.ex-name');
  const st = card.querySelector('.ex-sets');
  const rs = card.querySelector('.ex-rest');
  const nt = card.querySelector('.ex-note');
  const tp = card.querySelector('.ex-tempo-val');
  const ht = card.querySelector('.alt-hint');
  const mainN = card.dataset.mainN;

  if (isNowAlt) {
    // pick random alt from pool
    const pool = ALT_POOL[mainN] || [];
    if (!pool.length) { card.classList.remove('alt-on'); return; }
    let idx;
    do { idx = Math.floor(Math.random() * pool.length); }
    while (pool.length > 1 && idx === _lastAlt[cardId]);
    _lastAlt[cardId] = idx;
    const alt = pool[idx];
    if (nm) nm.textContent = alt.n;
    if (st) st.textContent = alt.s;
    if (rs && alt.r) rs.textContent = alt.r;
    if (nt) nt.textContent = alt.note;
    if (tp) { tp.textContent = alt.t || ''; tp.parentElement.style.display = alt.t ? '' : 'none'; }
    if (ht) ht.textContent = '⇄ tap again for another';
    btn.textContent = '↩ revert';
  } else {
    // restore main
    if (nm) nm.textContent = mainN;
    if (st) st.textContent = card.dataset.mainS;
    if (rs) rs.textContent = card.dataset.mainR;
    if (nt) nt.textContent = card.dataset.mainNote;
    if (tp) { tp.textContent = card.dataset.mainT || ''; tp.parentElement.style.display = card.dataset.mainT ? '' : 'none'; }
    if (ht) ht.textContent = 'Alt: tap to randomise';
    btn.textContent = '⇄ swap';
  }
}

/* ── UNDO COMPLETE ── */
function undoComplete(day) {
  S.doneDays = S.doneDays.filter(d => d !== day);
  // Clear all checked keys for this day
  Object.keys(S.checked).forEach(k => { if (k.startsWith(day + '-')) delete S.checked[k]; });
  saveS();
  // Update streak (just decrement if > 0)
  if (S.streak > 0) { S.streak--; document.getElementById('snum').textContent = S.streak; }
  // Update tab
  document.querySelector(`.tab[data-day="${day}"]`)?.classList.remove('day-done');
  // Re-render
  renderDay(day);
  updateRing(day);
  showToast('↩ Session reset — go again!');
}

/* ── RING FIX: patch renderDay to always set offset=138, then call updateRing ──
   We override the original renderDay by wrapping it.
*/
const _origRenderDay = renderDay;
renderDay = function(day) {
  _origRenderDay(day);
  // After DOM is written, update ring correctly
  setTimeout(() => updateRing(day), 0);
};

/* ── PATCH COMP BTN: inject undo link next to done button ──
   We hook into completeDay to add an undo link after render.
*/
const _origCompleteDay = completeDay;
completeDay = function(day) {
  _origCompleteDay(day);
  injectUndoBtn(day);
};

function injectUndoBtn(day) {
  const btn = document.getElementById('cbtn-' + day);
  if (!btn) return;
  // Remove existing undo if any
  const existing = document.getElementById('ubtn-' + day);
  if (existing) existing.remove();
  const undo = document.createElement('button');
  undo.id = 'ubtn-' + day;
  undo.textContent = '↩ Undo session complete';
  undo.style.cssText = `
    display:block;width:calc(100% - 24px);margin:8px 12px 4px;
    padding:12px 24px;border:1px dashed rgba(248,113,113,.4);border-radius:12px;
    background:transparent;color:var(--co);cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.06em;text-transform:uppercase;
  `;
  undo.onclick = () => undoComplete(day);
  btn.parentNode.insertBefore(undo, btn.nextSibling);
}

// On init, inject undo btns for already-done days
const _origInit = init;
// Re-run after base init
document.addEventListener('DOMContentLoaded', () => {
  // patch: after init runs, add undo buttons for persisted done days
  S.doneDays.forEach(d => injectUndoBtn(d));
  // Also fix alt hint text
  document.querySelectorAll('.alt-hint').forEach(h => h.textContent = 'Alt: tap to randomise');
}, {once:true});
</script>
