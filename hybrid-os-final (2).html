<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYBRID OS">
<meta name="theme-color" content="#0b1120">
<title>HYBRID // OS</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%230b1120' rx='100'/><text x='256' y='330' text-anchor='middle' font-size='300'>🏋️</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b1120;--sur:#111827;--card:#1a2338;--bor:#263348;--borhi:#3a5070;
  --txt:#e2e8f8;--mut:#5a7090;--dim:#2a3a55;
  --bl:#4f8ef7;--bldim:rgba(79,142,247,.14);
  --gr:#34d399;--grdim:rgba(52,211,153,.12);
  --am:#fbbf24;--amdim:rgba(251,191,36,.12);
  --co:#f87171;--codim:rgba(248,113,113,.12);
  --pu:#a78bfa;--pudim:rgba(167,139,250,.12);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;
  padding-bottom:calc(68px + var(--safe-b));overscroll-behavior:none;
  -webkit-text-size-adjust:100%}
::-webkit-scrollbar{display:none}

/* TYPOGRAPHY */
.bc{font-family:'Barlow Condensed',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fadeUp{animation:fadeUp .28s ease both}
.cp{position:fixed;top:-10px;pointer-events:none;z-index:9999;animation:fall linear forwards;border-radius:2px}

/* TOP NAV */
#topnav{
  position:sticky;top:0;z-index:200;
  background:rgba(11,17,32,.94);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bor);
  padding:calc(var(--safe-t) + 11px) 18px 11px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;letter-spacing:.1em;color:var(--bl)}
.logo em{color:var(--mut);font-style:normal;font-weight:400}
.streak-pill{display:flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--bor);border-radius:100px;padding:5px 12px 5px 8px}
.streak-num{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;color:var(--am);line-height:1}
.streak-lbl{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}

/* DAY VIEW */
.day-view{display:none;padding-bottom:12px}
.day-view.active{display:block;animation:fadeUp .28s ease}

/* HEADER */
.day-hdr{padding:18px 16px 0}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eyebrow::before{content:'';width:20px;height:1.5px;background:currentColor;border-radius:2px}
.day-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;line-height:.9;text-transform:uppercase;letter-spacing:-.01em}
.day-sub{font-size:13px;color:var(--mut);font-weight:300;margin-top:6px}

/* PROGRESS ROW */
.prog-row{display:flex;align-items:center;gap:16px;padding:14px 16px 0}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:0;position:relative;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg);display:block}
.ring-bg{fill:none;stroke:var(--bor);stroke-width:4}
.ring-arc{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:138;stroke-dashoffset:138;transition:stroke-dashoffset .4s ease}
.ring-pct{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);line-height:1}
.ring-sub{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:28px}
.pstats{display:flex;gap:20px}
.pstat-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;line-height:1}
.pstat-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:2px}

/* SWITCH BANNER */
.sw-banner{margin:14px 12px 0;background:var(--card);border:1px solid var(--bor);
  border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw-title{font-weight:600;font-size:14px;color:var(--txt)}
.sw-sub{font-size:12px;color:var(--mut);font-weight:300;margin-top:2px}
.sw-btn{flex-shrink:0;border-radius:100px;padding:8px 14px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;
  cursor:pointer;min-height:40px;white-space:nowrap;border:1.5px solid;transition:all .15s}
.sw-btn:active{transform:scale(.96)}

/* SECTION LABELS */
.sec-label{display:flex;align-items:center;gap:10px;margin:20px 16px 10px}
.sec-label-txt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.24em;
  text-transform:uppercase;flex-shrink:0}
.sec-line{flex:1;height:1px;background:var(--bor)}
.sec-norest{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.18em;
  color:var(--dim);text-transform:uppercase;flex-shrink:0}
.ss-bar{width:2px;height:16px;background:rgba(248,113,113,.5);border-radius:2px;flex-shrink:0}

/* EXERCISE CARDS */
.ex-list{padding:0 12px}
.ex-card{background:var(--card);border:1px solid var(--bor);border-radius:12px;margin-bottom:8px;
  overflow:hidden;transition:border-color .2s,background .2s}
.ex-card.done-card{border-color:var(--bl);background:rgba(79,142,247,.07)}
.ex-card.done-card.run-card{border-color:var(--gr);background:rgba(52,211,153,.07)}
.ex-card.done-card.plyo-card{border-color:var(--am);background:rgba(251,191,36,.07)}
.ex-card.done-card.hiit-card{border-color:var(--co);background:rgba(248,113,113,.07)}
.ex-card.alt-on .ex-name{color:var(--am)}

.ex-row{display:flex;align-items:stretch;min-height:58px;cursor:pointer;user-select:none}
.ex-chk{width:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--bor);cursor:pointer}
.chk-circle{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:transparent;transition:all .18s}
.ex-card.done-card .chk-circle{background:var(--bl);border-color:var(--bl);color:#fff}
.ex-card.done-card.run-card .chk-circle{background:var(--gr);border-color:var(--gr);color:#0b1120}
.ex-card.done-card.plyo-card .chk-circle{background:var(--am);border-color:var(--am);color:#000}
.ex-card.done-card.hiit-card .chk-circle{background:var(--co);border-color:var(--co);color:#fff}

.ex-info{flex:1;padding:10px 12px 10px 14px;min-width:0}
.ex-name{font-weight:600;font-size:15px;line-height:1.25;color:var(--txt)}
.ex-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;align-items:center}
.ex-sets{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--bl)}
.run-card .ex-sets{color:var(--gr)}
.plyo-card .ex-sets{color:var(--am)}
.hiit-card .ex-sets{color:var(--co)}
.ex-rest{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mut);
  background:rgba(0,0,0,.3);padding:2px 7px;border-radius:4px}
.alt-badge{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.14em;
  color:var(--am);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);
  padding:1px 6px;border-radius:4px;display:none}
.ex-card.alt-on .alt-badge{display:inline-block}

.ex-chev{width:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--mut);font-size:13px;transition:transform .2s}
.ex-card.open .ex-chev{transform:rotate(180deg);color:var(--txt)}

.ex-body{display:none;padding:12px 14px 14px 54px;border-top:1px solid var(--bor);
  background:rgba(0,0,0,.18)}
.ex-card.open .ex-body{display:block}
.ex-note{font-size:13px;color:var(--mut);line-height:1.7;font-weight:300}
.ex-tempo{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.1em;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ex-tempo b{color:var(--txt);font-weight:600}
.alt-row{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.alt-hint{font-size:11px;color:var(--mut);font-weight:300}
.alt-swap-btn{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;border-radius:100px;padding:5px 12px;cursor:pointer;
  min-height:30px;transition:all .15s;border:1px solid rgba(79,142,247,.4);
  color:var(--bl);background:var(--bldim)}
.ex-card.alt-on .alt-swap-btn{color:var(--am);background:var(--amdim);border-color:rgba(251,191,36,.4)}

/* RUN METRICS */
.run-metrics{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.rmc{background:var(--card);border:1px solid var(--bor);border-radius:12px;padding:14px}
.rmc-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gr);margin-bottom:5px}
.rmc-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;
  line-height:1;color:var(--txt);margin-bottom:3px}
.rmc-desc{font-size:11px;color:var(--mut);line-height:1.5;font-weight:300}

/* SHOE CHIP */
.shoe-chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--bor);border-radius:100px;padding:8px 14px 8px 10px;
  margin:10px 12px 0;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.1em;color:var(--gr);text-transform:uppercase}

/* MOBILITY */
.mob-grid{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mob-item{background:var(--card);border:1px solid var(--bor);border-radius:10px;
  padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;
  transition:all .18s;min-height:54px;user-select:none}
.mob-item:active{transform:scale(.97)}
.mob-item.mob-done{border-color:var(--pu);background:var(--pudim)}
.mob-chk{width:18px;height:18px;border-radius:5px;flex-shrink:0;margin-top:1px;
  border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:transparent;transition:all .18s}
.mob-item.mob-done .mob-chk{background:var(--pu);border-color:var(--pu);color:#fff}
.mob-name{font-size:13px;font-weight:500;line-height:1.3}
.mob-reps{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mut);margin-top:2px}

/* OPT CARDS */
.opt-grid{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-card{background:var(--card);border:1px dashed rgba(167,139,250,.4);border-radius:12px;padding:16px}
.opt-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;
  letter-spacing:.04em;color:var(--pu);margin-bottom:6px}
.opt-card p{font-size:12px;color:var(--mut);line-height:1.6;font-weight:300}

/* COMPLETE BTN */
.comp-btn{display:flex;align-items:center;justify-content:center;gap:10px;
  width:calc(100% - 24px);margin:18px 12px 4px;padding:17px 24px;
  border:none;border-radius:12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;
  letter-spacing:.1em;text-transform:uppercase;transition:all .2s}
.comp-btn:active{transform:scale(.98)}
.comp-btn.lift-btn{background:var(--bl);color:#fff;box-shadow:0 6px 20px rgba(79,142,247,.35)}
.comp-btn.run-btn{background:var(--gr);color:#0b1120;box-shadow:0 6px 20px rgba(52,211,153,.35)}
.comp-btn.plyo-btn{background:var(--am);color:#0b1120;box-shadow:0 6px 20px rgba(251,191,36,.3)}
.comp-btn.rest-btn{background:var(--pu);color:#fff}
.comp-btn.done-btn{background:var(--card)!important;color:var(--gr)!important;
  border:1.5px solid var(--gr)!important;box-shadow:none!important;cursor:default}
.comp-btn.done-btn:active{transform:none}

/* BOTTOM TAB BAR */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:rgba(17,24,39,.97);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--bor);
  padding-bottom:var(--safe-b);
  display:flex;height:calc(68px + var(--safe-b));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;padding:6px 2px;position:relative;transition:opacity .15s;
  user-select:none}
.tab:active{opacity:.6}
.tab-icon{font-size:19px;line-height:1;transition:transform .15s}
.tab.act .tab-icon{transform:scale(1.15)}
.tab-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);transition:color .15s}
.tab.act .tab-lbl{color:var(--txt)}
.tab-bar-top{position:absolute;top:0;left:20%;right:20%;height:2px;border-radius:2px;background:transparent}
.tab-done-dot{position:absolute;top:5px;right:calc(50% - 14px);
  width:6px;height:6px;border-radius:50%;background:var(--gr);display:none}
.tab.day-done .tab-done-dot{display:block}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--gr);border-radius:100px;
  padding:10px 22px;z-index:400;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--gr);
  white-space:nowrap;box-shadow:0 4px 20px rgba(52,211,153,.3);
  opacity:0;pointer-events:none;transition:opacity .3s,bottom .3s}
#toast.show{opacity:1;bottom:88px}

/* INSTALL BANNER */


</style>
</head>

<div id="topnav">

<div id="views"></div>

<div id="tabbar"></div>

/* =====================================================
   STATE (all persisted to localStorage)
===================================================== */
const STORE_KEY='hybridOS_v4';
let S={
  checked:{},    // "day-vk-si-ei": bool
  doneDays:[],
  streak:0,
  lastDate:'',
  lastActive:DAYS[(new Date().getDay()+6)%7],
  switched:{},   // day: 'A'|'B'
  mobDone:{},
};

function loadS(){
  try{const r=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
    Object.assign(S,r);
  }catch(e){}
  // ensure all fields exist
  if(!S.checked)S.checked={};
  if(!S.doneDays)S.doneDays=[];
  if(!S.streak)S.streak=0;
  if(!S.lastDate)S.lastDate='';
  if(!S.switched)S.switched={};
  if(!S.mobDone)S.mobDone={};
  if(!S.lastActive)S.lastActive=DAYS[(new Date().getDay()+6)%7];
}
function saveS(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}
}

/* =====================================================
   ACTIVE STATE
===================================================== */
let activeDay=null;
let expandedCards=new Set();
let altCards=new Set();

/* =====================================================
   HELPERS
===================================================== */
function typeAc(day){return TYPEAC[WD[day].type]||'var(--bl)'}
function variantKey(day){return S.switched[day]||'A'}
function getVariant(day){return WD[day][variantKey(day)]||WD[day].A}

function cardKeys(day){
  const v=getVariant(day),vk=variantKey(day);
  if(!v) return [];
  if(v.cl) return v.cl.map((_,i)=>`${day}-${vk}-CL-${i}`);
  const keys=[];
  (v.secs||[]).forEach((sec,si)=>(sec.ex||[]).forEach((_,ei)=>keys.push(`${day}-${vk}-${si}-${ei}`)));
  return keys;
}
function donePct(day){
  const keys=cardKeys(day),total=keys.length;
  if(!total)return 0;
  return Math.round(keys.filter(k=>S.checked[k]).length/total*100);
}
function updateRing(day){
  const p=donePct(day),r=22,circ=2*Math.PI*r;
  const arc=document.getElementById(`arc-${day}`);
  const pctEl=document.getElementById(`pct-${day}`);
  if(arc){arc.style.strokeDashoffset=circ-(p/100)*circ;}
  if(pctEl)pctEl.textContent=p+'%';
}

/* =====================================================
   TOAST
===================================================== */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

/* =====================================================
   CONFETTI
===================================================== */
function confetti(){
  const cols=['#4f8ef7','#34d399','#fbbf24','#a78bfa','#f87171','#fff'];
  for(let i=0;i<60;i++){
    setTimeout(()=>{
      const el=document.createElement('div');el.className='cp';
      const sz=Math.random()*8+4;
      el.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;
        background:${cols[Math.floor(Math.random()*cols.length)]};
        border-radius:${Math.random()>.5?'50%':'2px'};
        animation-duration:${Math.random()*2+1.5}s;
        animation-delay:${Math.random()*.4}s;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),4500);
    },i*18);
  }
}

/* =====================================================
   STREAK LOGIC
===================================================== */
function bumpStreak(){
  const today=new Date().toISOString().split('T')[0];
  if(S.lastDate===today)return;
  const yest=new Date(Date.now()-86400000).toISOString().split('T')[0];
  S.streak=(S.lastDate===yest||!S.lastDate)?S.streak+1:1;
  S.lastDate=today;
  document.getElementById('snum').textContent=S.streak;
}

/* =====================================================
   CHECK CARD
===================================================== */
function checkCard(key,el){
  const card=el.closest('.ex-card');
  S.checked[key]=!S.checked[key];
  const done=S.checked[key];
  card.classList.toggle('done-card',done);
  card.querySelector('.chk-circle').style.color=done?'':'transparent';
  saveS();
  updateRing(key.split('-')[0]);
}

/* =====================================================
   TOGGLE EXPAND
===================================================== */
function toggleExpand(cardId){
  const card=document.getElementById(cardId);
  if(!card||!card.querySelector('.ex-body'))return;
  if(expandedCards.has(cardId)){expandedCards.delete(cardId);card.classList.remove('open');}
  else{expandedCards.add(cardId);card.classList.add('open');}
}

/* =====================================================
   TOGGLE ALT
===================================================== */
function toggleAlt(cardId,btn){
  const card=document.getElementById(cardId);
  if(!card)return;
  const isNowAlt=!altCards.has(cardId);
  if(isNowAlt)altCards.add(cardId);else altCards.delete(cardId);
  card.classList.toggle('alt-on',isNowAlt);

  const nm=card.querySelector('.ex-name');
  const st=card.querySelector('.ex-sets');
  const rs=card.querySelector('.ex-rest');
  const nt=card.querySelector('.ex-note');
  const tp=card.querySelector('.ex-tempo-val');
  const ht=card.querySelector('.alt-hint');
  const mainN=card.dataset.mainN,altN=card.dataset.altN;
  const mainS=card.dataset.mainS,altS=card.dataset.altS;
  const mainR=card.dataset.mainR,altR=card.dataset.altR;
  const mainNote=card.dataset.mainNote,altNote=card.dataset.altNote;
  const mainT=card.dataset.mainT,altT=card.dataset.altT;

  if(nm)nm.textContent=isNowAlt?altN:mainN;
  if(st)st.textContent=isNowAlt?altS:mainS;
  if(rs&&altR)rs.textContent=isNowAlt?altR:mainR;
  if(nt)nt.textContent=isNowAlt?(altNote||mainNote):mainNote;
  if(tp)tp.textContent=isNowAlt?(altT||mainT||''):( mainT||'');
  if(ht)ht.textContent=isNowAlt?('↩ Back: '+mainN):('Alt: '+altN);
  btn.textContent=isNowAlt?'↩ revert':'⇄ swap';
}

/* =====================================================
   SWITCH WORKOUT (full day A/B)
===================================================== */
function switchWorkout(day){
  const cur=variantKey(day);
  const nxt=cur==='A'?'B':'A';
  if(!WD[day][nxt])return;
  S.switched[day]=nxt;
  // clear checked for this day
  Object.keys(S.checked).forEach(k=>{if(k.startsWith(day+'-'))delete S.checked[k];});
  saveS();
  renderDay(day);
  showToast(nxt==='B'?'💥 Switched to alternate workout!':'↩ Back to standard workout');
  if(activeDay===day)attachTabListeners();
}

/* =====================================================
   COMPLETE DAY
===================================================== */
function completeDay(day){
  if(S.doneDays.includes(day))return;
  // check all
  cardKeys(day).forEach(k=>{S.checked[k]=true;});
  S.doneDays.push(day);
  bumpStreak();saveS();
  renderDay(day);
  document.querySelector(`.tab[data-day="${day}"]`)?.classList.add('day-done');
  updateRing(day);
  confetti();
  showToast(MSGS[day]);
}

  return `<div class="ex-card ${typeClass} ${hiit} ${doneClass}" id="${cardId}"

      <div class="ex-chk" onclick="event.stopPropagation();checkCard('${key}',this)">

      </div>
      <div class="ex-info">
        <div class="ex-name">${esc(ex.n)}</div>
        <div class="ex-meta">
          <span class="ex-sets" style="color:${typeClass==='hiit-card'?'var(--co)':clr}">${esc(ex.s)}</span>
          ${ex.r&&ex.r!=='—'?`<span class="ex-rest">${esc(ex.r)}</span>`:''}
          ${hasAlt?'<span class="alt-badge">ALT</span>':''}
        </div>
      </div>
      ${ex.note?'<div class="ex-chev">▾</div>':''}
    </div>
    ${ex.note?`
    <div class="ex-body">
      <div class="ex-note">${esc(ex.note)}</div>
      ${ex.t?`<div class="ex-tempo">TEMPO <b class="ex-tempo-val">${esc(ex.t)}</b></div>`:''}
      ${hasAlt?`
      <div class="alt-row">
        <span class="alt-hint">Alt: ${esc(ex.an)}</span>
        <button class="alt-swap-btn" onclick="event.stopPropagation();toggleAlt('${cardId}',this)">⇄ swap</button>
      </div>`:''}
    </div>`:''}
  </div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* =====================================================
   RENDER A SINGLE DAY
===================================================== */
function renderDay(day){
  const d=WD[day];
  const v=getVariant(day);
  const vk=variantKey(day);
  const ac=TYPEAC[d.type]||'var(--bl)';
  const isDone=S.doneDays.includes(day);
  const btnClass={lift:'lift-btn',run:'run-btn',plyo:'plyo-btn',rest:'rest-btn'}[d.type]||'lift-btn';
  const typeClass={lift:'',run:'run-card',plyo:'plyo-card',rest:''}[d.type]||'';
  let html='';

  // Header
  html+=`<div class="day-hdr">
    <div class="eyebrow" style="color:${ac}">${esc(d.label)} · ${d.type==='lift'?day==='mon'?'Push Day':'Pull Day':d.type==='plyo'?'Plyo Day':d.type==='run'?'Run Day':'Rest'}</div>
    <div class="day-title bc">${d.title.map(t=>esc(t)).join('<br>')}</div>
    <div class="day-sub">${esc(d.sub)}</div>
  </div>`;

  // Progress row (not for rest)
  if(d.type!=='rest'){
    const p=donePct(day),r=22,circ=2*Math.PI*r,offset=circ-(p/100)*circ;
    html+=`<div class="prog-row">
      <div class="ring-wrap">
        <svg width="56" height="56" style="transform:rotate(-90deg)">
          <circle class="ring-bg" cx="28" cy="28" r="${r}"/>
          <circle class="ring-arc" id="arc-${day}" cx="28" cy="28" r="${r}"
            style="stroke:${ac};stroke-dashoffset:${offset}"/>
        </svg>
        <div class="ring-pct" id="pct-${day}" style="color:${ac}">${p}%</div>
        <div class="ring-sub">done</div>
      </div>
      <div class="pstats">
        <div><div class="pstat-val bc" style="color:${ac}">${d.stats.ex}</div><div class="pstat-lbl mono">${d.type==='run'?'checks':'exercises'}</div></div>
        <div><div class="pstat-val bc" style="color:var(--am)">~${d.stats.min}</div><div class="pstat-lbl mono">minutes</div></div>
      </div>
    </div>`;
  }

  // Switch banner (if B variant exists and v is defined)
  if(v && WD[day].B){
    const swColor=vk==='B'?'var(--gr)':ac;
    html+=`<div class="sw-banner">
      <div><div class="sw-title">${esc(v.label)}</div><div class="sw-sub">${esc(v.short)}</div></div>
      <button class="sw-btn" style="color:${swColor};border-color:${swColor};background:${vk==='B'?'var(--grdim)':'var(--bldim)'}"
        onclick="switchWorkout('${day}')">⇄ SWITCH</button>
    </div>`;
  }

  // Lift / Plyo day (sections)
  if(v && v.secs){
    v.secs.forEach((sec,si)=>{
      const secAc=AC[sec.ac]||'var(--mut)';
      html+=`<div class="sec-label">
        ${sec.ss?'<div class="ss-bar"></div>':''}
        <span class="sec-label-txt" style="color:${secAc}">${esc(sec.label)}</span>
        <div class="sec-line"></div>
        ${sec.ss?'<span class="sec-norest">NO REST</span>':''}
      </div>
      <div class="ex-list">`;
      (sec.ex||[]).forEach((ex,ei)=>{
        const key=`${day}-${vk}-${si}-${ei}`;
        const cardId=`card-${day}-${vk}-${si}-${ei}`;
        const tc=ex.hiit?'hiit-card':typeClass;
        html+=buildCard(day,ex,tc,key,cardId);
      });
      html+=`</div>`;
    });
  }

  // Run day (metrics + checklist)
  if(v && v.metrics){
    html+=`<div class="sec-label"><span class="sec-label-txt" style="color:var(--gr)">Session Details</span><div class="sec-line"></div></div>
    <div class="run-metrics">`;
    v.metrics.forEach(m=>{
      html+=`<div class="rmc"><div class="rmc-lbl mono">${esc(m.lbl)}</div>
        <div class="rmc-val bc">${esc(m.val)}</div>
        <div class="rmc-desc">${esc(m.desc)}</div></div>`;
    });
    html+=`</div>
    <div class="sec-label"><span class="sec-label-txt" style="color:var(--gr)">Checklist</span><div class="sec-line"></div></div>
    <div class="ex-list">`;
    (v.cl||[]).forEach((item,i)=>{
      const key=`${day}-${vk}-CL-${i}`;
      const cardId=`card-${day}-${vk}-CL-${i}`;
      const done=!!S.checked[key];
      const tc=typeClass||'run-card';
      const clr='var(--gr)';
      html+=`<div class="ex-card ${tc} ${done?'done-card':''}" id="${cardId}">
        <div class="ex-row" onclick="checkCard('${key}',this)">
          <div class="ex-chk">
            <div class="chk-circle" style="border-color:${done?clr:'var(--dim)'};background:${done?clr:'transparent'};color:${done?'#0b1120':'transparent'}">✓</div>
          </div>
          <div class="ex-info"><div class="ex-name">${esc(item)}</div></div>
        </div>
      </div>`;
    });
    html+=`</div>`;
    if(v.shoe)html+=`<div class="shoe-chip mono">👟 ${esc(v.shoe)}</div>`;
  }

  // Rest day (mobility + optional)
  if(d.mob){
    html+=`<div class="sec-label"><span class="sec-label-txt" style="color:var(--pu)">Mobility Protocol — 15–20 min</span><div class="sec-line"></div></div>
    <div class="mob-grid">`;
    d.mob.forEach((m,i)=>{
      const dk=`mob-${day}-${i}`;
      const done=!!S.mobDone[dk];
      html+=`<div class="mob-item ${done?'mob-done':''}" onclick="toggleMob('${dk}',this)">
        <div class="mob-chk" style="border-color:${done?'var(--pu)':'var(--dim)'};background:${done?'var(--pu)':'transparent'};color:${done?'#fff':'transparent'}">✓</div>
        <div><div class="mob-name">${esc(m.n)}</div><div class="mob-reps mono">${esc(m.r)}</div></div>
      </div>`;
    });
    html+=`</div>`;
    if(d.opt){
      html+=`<div class="sec-label" style="margin-top:24px"><span class="sec-label-txt" style="color:var(--pu)">Optional Activities</span><div class="sec-line"></div></div>
      <div class="opt-grid">`;
      d.opt.forEach(o=>{html+=`<div class="opt-card"><div class="opt-title bc">${esc(o.t)}</div><p>${esc(o.d)}</p></div>`;});
      html+=`</div>`;
    }
  }

  // Complete button
  const compLabel=isDone?'✓ Session Complete!':`⚡ Complete ${d.label}`;
  html+=`<button class="comp-btn ${isDone?'done-btn':btnClass}" id="cbtn-${day}"
    onclick="completeDay('${day}')">${compLabel}</button>
  <div style="height:8px"></div>`;

  // Set into container
  let el=document.getElementById(`view-${day}`);
  if(!el){el=document.createElement('div');el.id=`view-${day}`;el.className='day-view';
    document.getElementById('views').appendChild(el);}
  el.innerHTML=html;

  // Re-apply open/alt states
  expandedCards.forEach(cid=>{document.getElementById(cid)?.classList.add('open');});
  altCards.forEach(cid=>{document.getElementById(cid)?.classList.add('alt-on');});
}

/* =====================================================
   TOGGLE MOBILITY
===================================================== */
function toggleMob(key,el){
  S.mobDone[key]=!S.mobDone[key];
  el.classList.toggle('mob-done',S.mobDone[key]);
  const chk=el.querySelector('.mob-chk');
  chk.style.background=S.mobDone[key]?'var(--pu)':'transparent';
  chk.style.borderColor=S.mobDone[key]?'var(--pu)':'var(--dim)';
  chk.style.color=S.mobDone[key]?'#fff':'transparent';
  saveS();
}

/* =====================================================
   TAB BAR
===================================================== */
function buildTabBar(){
  const tb=document.getElementById('tabbar');
  DAYS.forEach(day=>{
    const d=WD[day];
    const ac=TYPEAC[d.type]||'var(--bl)';
    const el=document.createElement('div');
    el.className='tab'+(S.doneDays.includes(day)?' day-done':'');
    el.dataset.day=day;
    el.innerHTML=`<div class="tab-bar-top" id="tbt-${day}"></div>
      <div class="tab-done-dot"></div>
      <div class="tab-icon">${d.icon}</div>
      <div class="tab-lbl mono">${d.tab}</div>`;
    el.onclick=()=>goDay(day);
    tb.appendChild(el);
  });
}
function attachTabListeners(){}// tabs built once, onclick on elements

/* =====================================================
   SWITCH DAY
===================================================== */
function goDay(day){
  if(activeDay)document.getElementById(`view-${activeDay}`)?.classList.remove('active');
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.remove('act');
    document.getElementById('tbt-'+t.dataset.day).style.background='transparent';
  });
  activeDay=day;
  S.lastActive=day;saveS();
  const view=document.getElementById(`view-${day}`);
  if(view){view.classList.add('active');view.scrollTop=0;}
  window.scrollTo({top:0,behavior:'instant'});
  const tab=document.querySelector(`.tab[data-day="${day}"]`);
  if(tab){tab.classList.add('act');
    const ac=TYPEAC[WD[day].type]||'var(--bl)';
    document.getElementById('tbt-'+day).style.background=ac;
  }
}

/* =====================================================
   INIT
===================================================== */
function init(){
  loadS();
  document.getElementById('snum').textContent=S.streak;

  // Render all days
  DAYS.forEach(day=>renderDay(day));
  buildTabBar();

  // Show today (or last active)
  const startDay=S.lastActive||DAYS[(new Date().getDay()+6)%7];
  goDay(startDay);

  // Update rings
  DAYS.forEach(d=>updateRing(d));

  // Mark done tabs
  S.doneDays.forEach(d=>document.querySelector(`.tab[data-day="${d}"]`)?.classList.add('day-done'));
}

init();
</script>
